# Suivi ACM : construit automatiquement l'app Android « ACM Widgets » (APK) et la publie dans les « Releases » du dépôt.
# Lien de téléchargement permanent : https://github.com/Newboy7745/carnet-acm/releases/latest/download/ACM-Widgets.apk
# (même système que SJ Widgets ; le site GitHub Pages n'est pas concerné)
name: ACM Widgets (Android)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tests (déchiffrement du résumé de Suivi ACM, schéma lu par les widgets)
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest

      - name: Compiler l'APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ACM-Widgets.apk
          TAG="acm-widgets-${{ github.run_number }}"
          gh release create "$TAG" ACM-Widgets.apk \
            --title "ACM Widgets ${{ github.run_number }}" \
            --notes "Application Android des widgets de Suivi ACM. Installez ACM-Widgets.apk sur le téléphone (autoriser les applis inconnues), puis dans Suivi ACM : Données, Widgets Android, Connecter mes widgets." \
            --latest
